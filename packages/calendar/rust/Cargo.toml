[package]
name = "buddy-calendar"
version.workspace = true
edition.workspace = true
description = "Native BUDDY Calendar: local source-of-truth events, reminders, and AI tools"

[dependencies]
buddy-core = { path = "../../../core" }
buddy-database = { path = "../../../database" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tracing = "0.1"
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"

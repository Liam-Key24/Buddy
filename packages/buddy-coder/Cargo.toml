[package]
name = "buddy-coder"
version.workspace = true
edition.workspace = true
description = "Code Agent capability: Codex/Cursor CLI orchestration and PTY terminals"

[dependencies]
buddy-core = { path = "../../core" }
buddy-database = { path = "../../database" }
tauri = { version = "2", features = [] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
dirs = "6"
regex = "1"
portable-pty = "0.9"
uuid = { workspace = true }

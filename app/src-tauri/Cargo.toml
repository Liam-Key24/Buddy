[package]
name = "buddy-app"
version.workspace = true
edition.workspace = true
description = "Buddy - local-first AI desktop assistant"
authors = ["liamgk"]

[lib]
name = "buddy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util", "net", "signal"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
buddy-core = { path = "../../core" }
buddy-database = { path = "../../database" }
buddy-memory = { path = "../../memory" }
buddy-intelligence = { path = "../../intelligence" }
buddy-plugins = { path = "../../plugins" }
buddy-personality = { path = "../../personality" }
buddy-clarification = { path = "../../clarification" }
buddy-coder = { path = "../../packages/buddy-coder" }
buddy-calendar = { path = "../../packages/calendar/rust" }
dirs = "6"
chrono = { workspace = true }
keyring = { version = "3", features = ["apple-native"] }

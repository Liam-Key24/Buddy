[workspace]
members = [
    "core",
    "database",
    "memory",
    "intelligence",
    "plugins",
    "personality",
    "clarification",
    "packages/buddy-coder",
    "packages/calendar/rust",
    "app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
